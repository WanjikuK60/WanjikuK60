# Once a day: draw the contribution snake and the stats/languages cards in
# sunset colours, and publish them to the `output` branch the README shows.
name: Profile snake and stats

on:
  schedule:
    - cron: "17 3 * * *"  # 06:17 Nairobi time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Runs before snk: snk's container creates dist/ as root, so a later
      # step could not write into it.
      - name: Draw stats and languages cards
        run: python tools/make_stats.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sunset-snake.svg?color_snake=#c2396d&color_dots=#f3e6ef,#ffd27a,#ff9a5a,#c2396d,#5b1f6e
            dist/sunset-snake-dark.svg?color_snake=#ffc07a&color_dots=#2a1236,#5b1f6e,#8c2f6a,#c2396d,#ff7a59

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
