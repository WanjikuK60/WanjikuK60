a">&quot;Python&quot;</tspan><tspan fill="#efe3ff">, </tspan><tspan fill="#ffc07a">&quot;JavaScript&quot;</tspan><tspan fill="#efe3ff">, </tspan><tspan fill="#ffc07a">&quot;TypeScript&quot;</tspan><tspan fill="#efe3ff">]</tspan></text><text x="34" y="237.0" fill="#7d5a92" font-size="13" text-anchor="end">7</text><text class="line" style="animation-delay: 1.89s" x="58" y="261.5" xml:space="preserve"><tspan fill="#efe3ff">    learning </tspan><tspan fill="#ff8fb8">= </tspan><tspan fill="#efe3ff">[</tspan><tspan fill="#ffc07a">&quot;Azure&quot;</tspan><tspan fill="#efe3ff">, </tspan><tspan fill="#ffc07a">&quot;System design&quot;</tspan><tspan fill="#efe3ff">, </tspan><tspan fill="#ffc07a">&quot;Fair AI&quot;</tspan><tspan fill="#efe3ff">]</tspan></text><text x="34" y="261.5" fill="#7d5a92" font-size="13" text-anchor="end">8</text><text class="line" style="animation-delay: 2.11s" x="58" y="286.0" xml:space="preserve"><tspan fill="#efe3ff">    programme </tspan><tspan fill="#ff8fb8">= </tspan><tspan fill="#ffc07a">&quot;PLP 1MillionDevs&quot;</tspan></text><text x="34" y="286.0" fill="#7d5a92" font-size="13" text-anchor="end">9</text><text class="line" style="animation-delay: 2.33s" x="58" y="310.5" xml:space="preserve"></text><text x="34" y="310.5" fill="#7d5a92" font-size="13" text-anchor="end">10</text><text class="line" style="animation-delay: 2.55s" x="58" y="335.0" xml:space="preserve"><tspan fill="#ff8fb8">    def </tspan><tspan fill="#7fe0c4">mission</tspan><tspan fill="#efe3ff">(self):</tspan></text><text x="34" y="335.0" fill="#7d5a92" font-size="13" text-anchor="end">11</text><text class="line" style="animation-delay: 2.77s" x="58" y="359.5" xml:space="preserve"><tspan fill="#ff8fb8">        return </tspan><tspan fill="#ffc07a">&quot;Build tech that works for Africa&quot;</tspan></text><text x="34" y="359.5" fill="#7d5a92" font-size="13" text-anchor="end">12</text><text class="line" style="animation-delay: 2.99s" x="58" y="384.0" xml:space="preserve"></text><text x="34" y="384.0" fill="#7d5a92" font-size="13" text-anchor="end">13</text><text class="line" style="animation-delay: 3.21s" x="58" y="408.5" xml:space="preserve"><tspan fill="#c9a8dc"># Karibu! Let&#x27;s build something together</tspan></text><text x="34" y="408.5" fill="#7d5a92" font-size="13" text-anchor="end">14</text>
    </g>
    <rect class="cursor" x="410" y="393.5" width="9" height="19" fill="#ffd27a"/>

