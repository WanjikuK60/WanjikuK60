      <rect x="580" y="254" width="296" height="80" rx="12" fill="#ffb27a"/>
      <rect x="700" y="248" width="56" height="14" rx="3" fill="#ffffff" fill-opacity="0.55"/>
      <text x="604" y="304" font-size="30">🌽</text>
      <text x="650" y="280" font-size="14.5" font-weight="600" fill="#2a0f36">I taught a loan model</text>
      <text x="650" y="300" font-size="14.5" font-weight="600" fill="#2a0f36">to follow harvest seasons,</text>
      <text x="650" y="320" font-size="14.5" font-weight="800" fill="#2a0f36">not payslips</text>
    </g><g class="note n3" style="transform-origin: 728px 386px; --tilt: 2deg">
      <rect x="580" y="346" width="296" height="80" rx="12" fill="#c8a6ff"/>
      <rect x="700" y="340" width="56" height="14" rx="3" fill="#ffffff" fill-opacity="0.55"/>
      <text x="604" y="396" font-size="30">⚡</text>
      <text x="650" y="372" font-size="14.5" font-weight="600" fill="#2a0f36">I shipped a working</text>
      <text x="650" y="392" font-size="14.5" font-weight="600" fill="#2a0f36">webhook on Day 1</text>
      <text x="650" y="412" font-size="14.5" font-weight="800" fill="#2a0f36">of an industry sprint</text>
