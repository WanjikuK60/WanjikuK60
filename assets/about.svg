      <rect x="700" y="64" width="56" height="14" rx="3" fill="#ffffff" fill-opacity="0.55"/>
      <text x="604" y="120" font-size="30">🦒</text>
      <text x="650" y="96" font-size="14.5" font-weight="600" fill="#2a0f36">My study buddy explains</text>
      <text x="650" y="116" font-size="14.5" font-weight="600" fill="#2a0f36">the cloud in Kiswahili</text>
      <text x="650" y="136" font-size="14.5" font-weight="800" fill="#2a0f36">and Sheng</text>
    </g><g class="note n1" style="transform-origin: 728px 202px; --tilt: 1.6deg">
      <rect x="580" y="162" width="296" height="80" rx="12" fill="#ff9ac1"/>
      <rect x="700" y="156" width="56" height="14" rx="3" fill="#ffffff" fill-opacity="0.55"/>
      <text x="604" y="212" font-size="30">👻</text>
      <text x="650" y="188" font-size="14.5" font-weight="600" fill="#2a0f36">I turned my portfolio</text>
      <text x="650" y="208" font-size="14.5" font-weight="600" fill="#2a0f36">into a haunted mansion</text>
      <text x="650" y="228" font-size="14.5" font-weight="800" fill="#2a0f36">for a hackathon</text>
