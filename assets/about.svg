<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="About me. A girl in the Tech World. A Software Engineer in the making. Home: Nairobi, Kenya. Speaks English and Kiswahili. Codes in Python, JavaScript and TypeScript. Learning Azure, system design and fair AI, in the PLP 1MillionDevs programme. Mission: build tech that works for Africa. Fun facts: My study buddy explains the cloud in Kiswahili and Sheng. I turned my portfolio into a haunted mansion for a hackathon. I taught a loan model to follow harvest seasons, not payslips. I shipped a working webhook on Day 1 of an industry sprint.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e0b3b"/>
      <stop offset="0.55" stop-color="#4a1860"/>
      <stop offset="1" stop-color="#b13468"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2396d"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="452" rx="22"/></clipPath>
    <style>
      .line { opacity: 0; animation: typein .5s steps(12, end) forwards; }
      @keyframes typein { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
      .cursor { animation: blink .9s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .note { transform: rotate(var(--tilt)); animation: wobble 4s ease-in-out infinite alternate; }
      .n1 { animation-delay: -1s; } .n2 { animation-delay: -2s; } .n3 { animation-delay: -3s; }
      @keyframes wobble { from { transform: rotate(var(--tilt)) translateY(0); } to { transform: rotate(calc(var(--tilt) * -1)) translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#c)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="900" height="452" fill="url(#bg)"/>
    <circle cx="870" cy="20" r="140" fill="#ff7a59" fill-opacity="0.14"/>
    <circle cx="20" cy="452" r="120" fill="#c2396d" fill-opacity="0.18"/>

    <!-- Code window -->
    <rect x="18" y="20" width="540" height="412" rx="16" fill="#140724" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M18 36 a16 16 0 0 1 16 -16 h508 a16 16 0 0 1 16 16 v18 h-540 z" fill="url(#bar)"/>
    <circle cx="40" cy="38" r="6" fill="#ff5f57"/><circle cx="60" cy="38" r="6" fill="#febc2e"/><circle cx="80" cy="38" r="6" fill="#28c840"/>
    <text x="288" y="43" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">about_me.py</text>
