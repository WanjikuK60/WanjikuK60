<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70" role="img" aria-label="GitHub activity">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b1f6e" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#c2396d"/>
      <stop offset="0.5" stop-color="#ff7a59"/>
      <stop offset="0.75" stop-color="#c2396d"/>
      <stop offset="1" stop-color="#5b1f6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#c2396d"/>
      <stop offset="0.45" stop-color="#ff7a59"/>
      <stop offset="0.5" stop-color="#ffc07a"/>
      <stop offset="0.55" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#c2396d"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="spark" d="M0 -10 C 1 -3, 3 -1, 10 0 C 3 1, 1 3, 0 10 C -1 3, -3 1, -10 0 C -3 -1, -1 -3, 0 -10 Z"/>
    <style>
      .bob { animation: bob 3s ease-in-out infinite alternate; }
      .sp { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out infinite; }@keyframes sparkle { 0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; } 45% { transform: scale(1) rotate(45deg); opacity: 1; } 60% { transform: scale(.75) rotate(90deg); opacity: .9; } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <path d="M0 56 C 150 42, 300 66, 450 52 S 750 42, 900 56" fill="none" stroke="url(#line)" stroke-width="3"/>
  <g class="bob"><circle cx="450" cy="52" r="18" fill="url(#sun)"/><circle cx="450" cy="52" r="8" fill="#ffc07a"/></g>
  <text x="450" y="30" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="url(#txt)" text-anchor="middle" letter-spacing="1">GitHub activity</text>
  <g filter="url(#glowf)"><g transform="translate(248 14) scale(1.38)"><use class="sp" href="#spark" fill="#ffd27a" style="animation-delay:-1.46s"/></g><g transform="translate(652 20) scale(0.73)"><use class="sp" href="#spark" fill="#ff8fb8" style="animation-delay:-0.05s"/></g><g transform="translate(224 32) scale(1.32)"><use class="sp" href="#spark" fill="#7fe0a0" style="animation-delay:-0.41s"/></g><g transform="translate(678 8) scale(1.19)"><use class="sp" href="#spark" fill="#7fe0ff" style="animation-delay:-0.67s"/></g><g transform="translate(230 44) scale(0.94)"><use class="sp" href="#spark" fill="#7fe0a0" style="animation-delay:-1.00s"/></g><g transform="translate(680 46) scale(0.97)"><use class="sp" href="#spark" fill="#7fe0ff" style="animation-delay:-0.64s"/></g><g transform="translate(90 54) scale(1.30)"><use class="sp" href="#spark" fill="#ffb27a" style="animation-delay:-0.99s"/></g><g transform="translate(820 50) scale(0.92)"><use class="sp" href="#spark" fill="#7fe0ff" style="animation-delay:-2.59s"/></g></g>
</svg>
