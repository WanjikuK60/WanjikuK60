    <circle cx="450" cy="120" r="54" fill="#ffd27a" fill-opacity="0.9"/>
    <path d="M0 100 C 150 86, 300 104, 450 94 S 750 86, 900 100 L900 120 L0 120 Z" fill="#1c0826"/>
    <g fill="#1c0826" transform="translate(110 64) scale(0.6)"><path d="M24 60 L26 34 L18 26 L21 24 L28 31 L29 20 L32 20 L31 32 L38 25 L41 27 L33 35 L31 60 Z"/><path d="M4 26 C 12 16, 30 15, 38 18 C 46 15, 62 17, 66 25 C 56 30, 42 28, 36 28 C 26 31, 12 31, 4 26 Z"/></g>
    <g fill="#1c0826" transform="translate(720 70) scale(0.5)"><path d="M24 60 L26 34 L18 26 L21 24 L28 31 L29 20 L32 20 L31 32 L38 25 L41 27 L33 35 L31 60 Z"/><path d="M4 26 C 12 16, 30 15, 38 18 C 46 15, 62 17, 66 25 C 56 30, 42 28, 36 28 C 26 31, 12 31, 4 26 Z"/></g>
    <text x="450" y="50" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">Asante for visiting!</text>
    <g filter="url(#glowf)"><g transform="translate(260 34) scale(1.21)"><use class="sp" href="#spark" fill="#c8a6ff" style="animation-delay:-2.40s"/></g><g transform="translate(640 30) scale(1.50)"><use class="sp" href="#spark" fill="#ffffff" style="animation-delay:-1.42s"/></g><g transform="translate(220 62) scale(1.33)"><use class="sp" href="#spark" fill="#ff8fb8" style="animation-delay:-2.25s"/></g><g transform="translate(690 64) scale(1.23)"><use class="sp" href="#spark" fill="#c8a6ff" style="animation-delay:-2.22s"/></g><g transform="translate(330 18) scale(0.88)"><use class="sp" href="#spark" fill="#7fe0ff" style="animation-delay:-0.40s"/></g><g transform="translate(580 16) scale(1.28)"><use class="sp" href="#spark" fill="#7fe0a0" style="animation-delay:-1.78s"/></g><g transform="translate(60 24) scale(1.34)"><use class="sp" href="#spark" fill="#ffffff" style="animation-delay:-2.70s"/></g><g transform="translate(850 30) scale(1.39)"><use class="sp" href="#spark" fill="#c8a6ff" style="animation-delay:-1.82s"/></g><g transform="translate(400 80) scale(1.36)"><use class="sp" href="#spark" fill="#ffb27a" style="animation-delay:-1.48s"/></g><g transform="translate(500 76) scale(0.85)"><use class="sp" href="#spark" fill="#ff8fb8" style="animation-delay:-2.46s"/></g></g>
