<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-label="Savannah Loan System: Harvest-aware, bias-audited loan decisions for informal market vendors in East Africa.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2396d"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="440" height="224" rx="18"/></clipPath>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="spark" d="M0 -10 C 1 -3, 3 -1, 10 0 C 3 1, 1 3, 0 10 C -1 3, -3 1, -10 0 C -3 -1, -1 -3, 0 -10 Z"/>
    <style>
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 85%, 100% { transform: translateX(560px) skewX(-20deg); } }
      .float { animation: float 4s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      .sp { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out infinite; }@keyframes sparkle { 0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; } 45% { transform: scale(1) rotate(45deg); opacity: 1; } 60% { transform: scale(.75) rotate(90deg); opacity: .9; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#c)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="440" height="224" fill="url(#bg)"/>
    <circle cx="400" cy="200" r="120" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="380" cy="150" r="58" fill="#ffd27a" fill-opacity="0.12"/>
    <path d="M0 208 C 120 198, 300 214, 440 202 L440 224 L0 224 Z" fill="#1c0826" fill-opacity="0.3"/>
    <g class="float"><g transform="translate(336 76)"><ellipse cx="34" cy="46" rx="13" ry="30" fill="#ffd27a"/><path d="M34 76 q -26 -6 -30 -34 q 18 8 30 22 q 12 -14 30 -22 q -4 28 -30 34 z" fill="#7fd18b"/><path d="M34 76 v 26" stroke="#7fd18b" stroke-width="4"/><ellipse cx="72" cy="104" rx="14" ry="5" fill="#ffd27a" stroke="#c2396d" stroke-width="1.5"/><ellipse cx="72" cy="96" rx="14" ry="5" fill="#ffd27a" stroke="#c2396d" stroke-width="1.5"/><ellipse cx="72" cy="88" rx="14" ry="5" fill="#ffd27a" stroke="#c2396d" stroke-width="1.5"/><ellipse cx="72" cy="80" rx="14" ry="5" fill="#ffd27a" stroke="#c2396d" stroke-width="1.5"/></g></g>
    <rect x="356" y="18" width="66" height="24" rx="12" fill="#1c0826" fill-opacity="0.35"/>
    <circle class="dot" cx="370" cy="30" r="4" fill="#7fe0a0"/>
    <text x="380" y="35" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE</text>
    <text x="28" y="56" font-size="24" font-weight="800" fill="#ffffff">Savannah Loan System</text>
    <text x="28" y="96" font-size="15.5" fill="#ffffff" fill-opacity="0.92">Harvest-aware, bias-audited loan</text><text x="28" y="118" font-size="15.5" fill="#ffffff" fill-opacity="0.92">decisions for informal market vendors</text><text x="28" y="140" font-size="15.5" fill="#ffffff" fill-opacity="0.92">in East Africa.</text>
    <rect x="28.0" y="174" width="57.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="56.5" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">React</text><rect x="93.0" y="174" width="92.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="139.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">TypeScript</text><rect x="193.0" y="174" width="85.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="235.5" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">AI ethics</text>
    <g filter="url(#glowf)"><g transform="translate(334 30) scale(0.74)"><use class="sp" href="#spark" fill="#ffffff" style="animation-delay:-0.35s"/></g><g transform="translate(424 66) scale(1.02)"><use class="sp" href="#spark" fill="#ffd27a" style="animation-delay:-0.38s"/></g><g transform="translate(318 150) scale(1.09)"><use class="sp" href="#spark" fill="#c8a6ff" style="animation-delay:-0.59s"/></g><g transform="translate(420 176) scale(0.99)"><use class="sp" href="#spark" fill="#ffffff" style="animation-delay:-1.36s"/></g></g>
    <rect class="sweep" x="0" y="-20" width="120" height="270" fill="url(#sweep)"/>
  </g>
</svg>
