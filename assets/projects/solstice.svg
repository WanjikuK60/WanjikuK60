<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-label="Solstice Kiosk: An event check-in kiosk that swaps polling for an asynchronous webhook flow.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8326a"/>
      <stop offset="1" stop-color="#ef6a55"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="440" height="224" rx="18"/></clipPath>
    <style>
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 85%, 100% { transform: translateX(560px) skewX(-20deg); } }
      .float { animation: float 4s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#c)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="440" height="224" fill="url(#bg)"/>
    <circle cx="400" cy="200" r="120" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="380" cy="150" r="58" fill="#ffd27a" fill-opacity="0.12"/>
    <path d="M0 208 C 120 198, 300 214, 440 202 L440 224 L0 224 Z" fill="#1c0826" fill-opacity="0.3"/>
    <g class="float"><g transform="translate(336 76)"><circle cx="44" cy="40" r="22" fill="#ffd27a"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(0 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(45 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(90 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(135 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(180 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(225 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(270 44 40)"/><rect x="42" y="2" width="4" height="10" rx="2" fill="#ffd27a" transform="rotate(315 44 40)"/><path d="M8 74 h 72 v 10 a6 6 0 0 0 0 12 v 10 h -72 v -10 a6 6 0 0 0 0 -12 z" fill="#ffffff" fill-opacity="0.92"/><path d="M30 76 v 28" stroke="#c2396d" stroke-width="2" stroke-dasharray="3 3"/></g></g>
    <rect x="356" y="18" width="66" height="24" rx="12" fill="#1c0826" fill-opacity="0.35"/>
    <circle class="dot" cx="370" cy="30" r="4" fill="#7fe0a0"/>
    <text x="380" y="35" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE</text>
    <text x="28" y="56" font-size="24" font-weight="800" fill="#ffffff">Solstice Kiosk</text>
    <text x="28" y="96" font-size="15.5" fill="#ffffff" fill-opacity="0.92">An event check-in kiosk that swaps</text><text x="28" y="118" font-size="15.5" fill="#ffffff" fill-opacity="0.92">polling for an asynchronous webhook</text><text x="28" y="140" font-size="15.5" fill="#ffffff" fill-opacity="0.92">flow.</text>
    <rect x="28.0" y="174" width="64.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="60.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Python</text><rect x="100.0" y="174" width="71.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="135.5" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">FastAPI</text><rect x="179.0" y="174" width="78.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="218.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Webhooks</text>
    <rect class="sweep" x="0" y="-20" width="120" height="270" fill="url(#sweep)"/>
  </g>
