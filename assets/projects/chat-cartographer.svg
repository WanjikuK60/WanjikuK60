<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-label="Chat Cartographer: A Twitch chat overlay that maps viewer theories, discoveries and running jokes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f36"/>
      <stop offset="1" stop-color="#7a2d8a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="440" height="224" rx="18"/></clipPath>
    <style>
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 85%, 100% { transform: translateX(560px) skewX(-20deg); } }
      .float { animation: float 4s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#c)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="440" height="224" fill="url(#bg)"/>
    <circle cx="400" cy="200" r="120" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="380" cy="150" r="58" fill="#ffd27a" fill-opacity="0.12"/>
    <path d="M0 208 C 120 198, 300 214, 440 202 L440 224 L0 224 Z" fill="#1c0826" fill-opacity="0.3"/>
    <g class="float"><g transform="translate(336 76)"><path d="M8 14 h 58 a8 8 0 0 1 8 8 v 30 a8 8 0 0 1 -8 8 h -34 l -14 12 v -12 h -10 a8 8 0 0 1 -8 -8 v -30 a8 8 0 0 1 8 -8 z" fill="#ffffff" fill-opacity="0.92"/><circle cx="24" cy="37" r="4" fill="#7a2d8a"/><circle cx="38" cy="37" r="4" fill="#7a2d8a"/><circle cx="52" cy="37" r="4" fill="#7a2d8a"/><path d="M66 66 a16 16 0 0 1 16 16 c 0 12 -16 28 -16 28 s -16 -16 -16 -28 a16 16 0 0 1 16 -16 z" fill="#ffd27a"/><circle cx="66" cy="82" r="6" fill="#2a0f36"/></g></g>
    <rect x="356" y="18" width="66" height="24" rx="12" fill="#1c0826" fill-opacity="0.35"/>
    <circle class="dot" cx="370" cy="30" r="4" fill="#7fe0a0"/>
    <text x="380" y="35" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE</text>
    <text x="28" y="56" font-size="24" font-weight="800" fill="#ffffff">Chat Cartographer</text>
    <text x="28" y="96" font-size="15.5" fill="#ffffff" fill-opacity="0.92">A Twitch chat overlay that maps</text><text x="28" y="118" font-size="15.5" fill="#ffffff" fill-opacity="0.92">viewer theories, discoveries and</text><text x="28" y="140" font-size="15.5" fill="#ffffff" fill-opacity="0.92">running jokes.</text>
    <rect x="28.0" y="174" width="92.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="74.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">JavaScript</text><rect x="128.0" y="174" width="64.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="160.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Twitch</text><rect x="200.0" y="174" width="71.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="235.5" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Overlay</text>
    <rect class="sweep" x="0" y="-20" width="120" height="270" fill="url(#sweep)"/>
  </g>
</svg>
