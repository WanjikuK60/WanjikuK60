<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-label="QuickNotes System Design: A notes service designed for 1 million users: REST API, PostgreSQL model and scalable architecture.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1650"/>
      <stop offset="1" stop-color="#8c2f6a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="440" height="224" rx="18"/></clipPath>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="spark" d="M0 -10 C 1 -3, 3 -1, 10 0 C 3 1, 1 3, 0 10 C -1 3, -3 1, -10 0 C -3 -1, -1 -3, 0 -10 Z"/>
    <style>
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 85%, 100% { transform: translateX(560px) skewX(-20deg); } }
      .float { animation: float 4s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      .sp { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out infinite; }@keyframes sparkle { 0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; } 45% { transform: scale(1) rotate(45deg); opacity: 1; } 60% { transform: scale(.75) rotate(90deg); opacity: .9; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#c)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="440" height="224" fill="url(#bg)"/>
    <circle cx="400" cy="200" r="120" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="380" cy="150" r="58" fill="#ffd27a" fill-opacity="0.12"/>
    <path d="M0 208 C 120 198, 300 214, 440 202 L440 224 L0 224 Z" fill="#1c0826" fill-opacity="0.3"/>
    <g class="float"><g transform="translate(336 76)"><g transform="translate(30 10)"><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/><path d="M0 0 v 20 a14 5 0 0 0 28 0 v -20" fill="#ffffff" fill-opacity="0.9"/><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/></g><g transform="translate(4 72)"><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/><path d="M0 0 v 20 a14 5 0 0 0 28 0 v -20" fill="#ffffff" fill-opacity="0.9"/><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/></g><g transform="translate(56 72)"><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/><path d="M0 0 v 20 a14 5 0 0 0 28 0 v -20" fill="#ffffff" fill-opacity="0.9"/><ellipse cx="14" cy="0" rx="14" ry="5" fill="#ffd27a"/></g><path d="M44 38 L18 70 M44 38 L70 70 M32 86 H56" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4"/></g></g>
    <rect x="356" y="18" width="66" height="24" rx="12" fill="#1c0826" fill-opacity="0.35"/>
    <circle class="dot" cx="370" cy="30" r="4" fill="#7fe0a0"/>
    <text x="380" y="35" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE</text>
    <text x="28" y="56" font-size="24" font-weight="800" fill="#ffffff">QuickNotes System Design</text>
    <text x="28" y="96" font-size="15.5" fill="#ffffff" fill-opacity="0.92">A notes service designed for 1</text><text x="28" y="118" font-size="15.5" fill="#ffffff" fill-opacity="0.92">million users: REST API, PostgreSQL</text><text x="28" y="140" font-size="15.5" fill="#ffffff" fill-opacity="0.92">model and scalable architecture.</text>
    <rect x="28.0" y="174" width="113.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="84.5" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">System design</text><rect x="149.0" y="174" width="92.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="195.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">PostgreSQL</text><rect x="249.0" y="174" width="50.0" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/><text x="274.0" y="191.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">REST</text>
    <g filter="url(#glowf)"><g transform="translate(334 30) scale(0.76)"><use class="sp" href="#spark" fill="#7fe0a0" style="animation-delay:-2.55s"/></g><g transform="translate(424 66) scale(1.08)"><use class="sp" href="#spark" fill="#ff8fb8" style="animation-delay:-1.83s"/></g><g transform="translate(318 150) scale(1.00)"><use class="sp" href="#spark" fill="#ffb27a" style="animation-delay:-0.63s"/></g><g transform="translate(420 176) scale(1.04)"><use class="sp" href="#spark" fill="#ff8fb8" style="animation-delay:-0.20s"/></g></g>
    <rect class="sweep" x="0" y="-20" width="120" height="270" fill="url(#sweep)"/>
  </g>
</svg>
